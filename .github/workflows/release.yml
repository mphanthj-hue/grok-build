name: Build binary

# Builds the `xai-grok-pager` release binary and attaches it to a GitHub
# Release so it can be downloaded directly (no local build needed).
# Runs on every push to main and on manual dispatch (Actions -> Build binary
# -> Run workflow).

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: build-bin-${{ github.ref }}
  cancel-in-progress: true

# GITHUB_TOKEN needs contents:write to create the GitHub Release and
# attach the binary asset to it.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config nasm libssl-dev

      # xai-grok-tools-api compiles .proto files; the repo's dotslash
      # wrapper for bin/protoc is not available on runners, so install a
      # real protoc and point PROTOC at it explicitly.
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "25.3"

      # Repo pins Rust 1.92.0 via rust-toolchain.toml.
      - name: Install Rust toolchain (1.92.0)
        run: |
          rustup toolchain install 1.92.0 --profile minimal
          rustup default 1.92.0

      - name: Cache cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: |
          PROTOC="$(command -v protoc)" cargo build -p xai-grok-pager-bin --profile release-dist
          ls -lh target/release-dist/xai-grok-pager

      - name: Strip binary and keep debug symbols
        run: |
          cp target/release-dist/xai-grok-pager xai-grok-pager.debug
          objcopy --only-keep-debug xai-grok-pager.debug xai-grok-pager.dbg
          strip --strip-debug --strip-unneeded target/release-dist/xai-grok-pager
          rm -f xai-grok-pager.debug
          ls -lh target/release-dist/xai-grok-pager xai-grok-pager.dbg

      - name: Smoke test
        run: |
          target/release-dist/xai-grok-pager --version

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: xai-grok-pager-x86_64-unknown-linux-gnu
          path: target/release-dist/xai-grok-pager
          retention-days: 30

      - name: Upload debug symbols artifact
        uses: actions/upload-artifact@v4
        with:
          name: xai-grok-pager-debug-symbols
          path: xai-grok-pager.dbg
          retention-days: 30

      - name: Create GitHub Release (prerelease)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-build-${{ github.run_number }}
          name: "Grok Build CI binary #${{ github.run_number }}"
          body: |
            Automated build from commit `${{ github.sha }}`.

            - Crate version: 0.2.116 (xai-grok-pager)
            - Platform: Linux x86_64 (glibc, Ubuntu 24.04 runner)
            - Built with `release-dist` profile (thin LTO, codegen-units=1, debug=1)
            - Tolerant-parsing layer for nearly-OpenAI-compatible providers included.
            - How to use: download `xai-grok-pager`, `chmod +x` it, and run.
            - Debug symbols available as separate artifact (`xai-grok-pager-debug-symbols`)
          prerelease: true
          files: |
            target/release-dist/xai-grok-pager
            xai-grok-pager.dbg
